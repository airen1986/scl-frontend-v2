<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supply Chain Lite - Notifications</title>
    <link rel="icon" type="image/svg+xml" href="scc.svg" />
  </head>
  <body class="min-vh-100 d-flex flex-column">
    <a href="#main-content" class="visually-hidden-focusable">Skip to main content</a>
    <div id="pageLoader" class="page-loader d-none" role="status" aria-live="polite">
      <div class="page-loader__content text-center">
        <div class="spinner-border text-dark" aria-hidden="true"></div>
        <div class="mt-2 small text-body-secondary">Loading table data...</div>
      </div>
    </div>

    <main id="main-content" class="flex-fill d-flex flex-column" tabindex="-1">
      <!-- Table Title and Refresh -->

      <div class="d-flex justify-content-between align-items-center my-2 mx-1">
        <h5 class="mb-0 d-flex align-items-center" id="notifDisplayName" aria-live="polite">
          <i class="fa-solid fa-bell me-2" aria-hidden="true"></i>
          <span>Notifications</span>
          <span class="badge bg-danger ms-2" id="unreadCountBadge">3</span>
        </h5>
        <a href="home-page.html" class="text-dark" aria-label="Go to home page">
          <i class="fa-solid fa-home" aria-hidden="true"></i>
        </a>
      </div>

      <!-- <div class="flex-fill d-flex">

        </div> -->
      <!-- Table -->
      <div
        id="sclTableDiv"
        class="flex-fill d-flex align-items-start mx-1"
        style="overflow-y: auto"
        role="region"
        aria-label="Notifications data"
        aria-live="polite"
      >
        <table
          class="table table-hover table-sm table-bordered mb-0 scl-table"
          aria-labelledby="notifDisplayName"
        >
          <thead class="scl-thead">
            <tr id="sclTableHead1" class="head1">
              <th style="width: 40px">
                <input type="checkbox" class="form-check-input" aria-label="Select all rows" />
              </th>
              <th >
                <div class="d-flex justify-content-between align-items-center">
                  <span>Status</span>
                  <button
                    type="button"
                    class="scl-sort-btn btn btn-link btn-sm p-0 text-dark"
                    aria-label="Sort by Status"
                  >
                    <i class="fa-solid fa-sort"></i>
                  </button>
                </div>
              </th>
              <th >
                <div class="d-flex justify-content-between align-items-center">
                  <span>Title</span>
                  <button
                    type="button"
                    class="scl-sort-btn btn btn-link btn-sm p-0 text-dark"
                    aria-label="Sort by Title"
                  >
                    <i class="fa-solid fa-sort"></i>
                  </button>
                </div>
              </th>
              <th >
                <div class="d-flex justify-content-between align-items-center">
                  <span>Message</span>
                  <button
                    type="button"
                    class="scl-sort-btn btn btn-link btn-sm p-0 text-dark"
                    aria-label="Sort by Message"
                  >
                    <i class="fa-solid fa-sort"></i>
                  </button>
                </div>
              </th>
              <th >
                <div class="d-flex justify-content-between align-items-center">
                  <span>ModelName</span>
                  <button
                    type="button"
                    class="scl-sort-btn btn btn-link btn-sm p-0 text-dark"
                    aria-label="Sort by ModelName"
                  >
                    <i class="fa-solid fa-sort"></i>
                  </button>
                </div>
              </th>
              <th >
                <div class="d-flex justify-content-between align-items-center">
                  <span>ProjectName</span>
                  <button
                    type="button"
                    class="scl-sort-btn btn btn-link btn-sm p-0 text-dark"
                    aria-label="Sort by ProjectName"
                  >
                    <i class="fa-solid fa-sort"></i>
                  </button>
                </div>
              </th>
              <th  class="">
                <div class="d-flex justify-content-between align-items-center">
                  <span>CreatedAt</span>
                  <button
                    type="button"
                    class="scl-sort-btn btn btn-link btn-sm p-0 text-dark"
                    aria-label="Sort by CreatedAt"
                  >
                    <i class="fa-solid fa-sort"></i>
                  </button>
                </div>
              </th>
              <th >
                <div class="d-flex justify-content-between align-items-center">
                  <span>Action</span>
                  <button
                    type="button"
                    class="scl-sort-btn btn btn-link btn-sm p-0 text-dark"
                    aria-label="Sort by Action"
                  >
                    <i class="fa-solid fa-sort"></i>
                  </button>
                </div>
              </th>
            </tr>
            <!-- Filter Row -->
            <tr id="sclTableHead2" class="head2">
              <th style="--head1-height: 33px"></th>
              <th style="--head1-height: 33px">
                <div class="input-group input-group-sm my-1" style="flex-wrap: nowrap">
                  <input
                    type="text"
                    class="form-control"
                    data-col="Status"
                    aria-label="Filter Status"
                    
                  />
                  <button
                    type="button"
                    class="input-group-text px-1"
                    aria-label="Select filter for Status"
                    data-bs-toggle="dropdown"
                    data-bs-auto-close="outside"
                    aria-expanded="false"
                    data-col-index="1"
                  >
                    <i class="fa-solid fa-chevron-down"></i>
                  </button>
                  <div class="dropdown-menu dropdown-menu-start">
                    <form style="font-size: 0.8rem">
                      <a class="dropdown-item px-2 py-0">
                        <div class="form-check">
                          <input
                            class="form-check-input selectAll"
                            type="checkbox"
                            id="filter-select-all-Status-1"
                          />
                          <label class="form-check-label" for="filter-select-all-Status-1">
                            Select All
                          </label>
                        </div>
                      </a>
                      <div class="dropdown-divider"></div>
                      <fieldset class="lovValuesFieldset"></fieldset>
                      <div class="dropdown-divider"></div>
                      <div class="dropdown-item d-flex px-2 py-0 clearOKBtn"></div>
                    </form>
                  </div>
                </div>
              </th>
              <th style="--head1-height: 33px">
                <div class="input-group input-group-sm my-1" style="flex-wrap: nowrap">
                  <input
                    type="text"
                    class="form-control"
                    data-col="Title"
                    aria-label="Filter Title"
                    
                  />
                  <button
                    type="button"
                    class="input-group-text px-1"
                    aria-label="Select filter for Title"
                    data-bs-toggle="dropdown"
                    data-bs-auto-close="outside"
                    aria-expanded="false"
                    data-col-index="2"
                  >
                    <i class="fa-solid fa-chevron-down"></i>
                  </button>
                  <div class="dropdown-menu dropdown-menu-start">
                    <form style="font-size: 0.8rem">
                      <a class="dropdown-item px-2 py-0">
                        <div class="form-check">
                          <input
                            class="form-check-input selectAll"
                            type="checkbox"
                            id="filter-select-all-Title-2"
                          />
                          <label class="form-check-label" for="filter-select-all-Title-2">
                            Select All
                          </label>
                        </div>
                      </a>
                      <div class="dropdown-divider"></div>
                      <fieldset class="lovValuesFieldset"></fieldset>
                      <div class="dropdown-divider"></div>
                      <div class="dropdown-item d-flex px-2 py-0 clearOKBtn"></div>
                    </form>
                  </div>
                </div>
              </th>
              <th style="--head1-height: 33px">
                <div class="input-group input-group-sm my-1" style="flex-wrap: nowrap">
                  <input
                    type="text"
                    class="form-control"
                    data-col="Message"
                    aria-label="Filter Message"
                    
                  />
                  <button
                    type="button"
                    class="input-group-text px-1"
                    aria-label="Select filter for Message"
                    data-bs-toggle="dropdown"
                    data-bs-auto-close="outside"
                    aria-expanded="false"
                    data-col-index="3"
                  >
                    <i class="fa-solid fa-chevron-down"></i>
                  </button>
                  <div class="dropdown-menu dropdown-menu-start">
                    <form style="font-size: 0.8rem">
                      <a class="dropdown-item px-2 py-0">
                        <div class="form-check">
                          <input
                            class="form-check-input selectAll"
                            type="checkbox"
                            id="filter-select-all-Message-3"
                          />
                          <label class="form-check-label" for="filter-select-all-Message-3">
                            Select All
                          </label>
                        </div>
                      </a>
                      <div class="dropdown-divider"></div>
                      <fieldset class="lovValuesFieldset"></fieldset>
                      <div class="dropdown-divider"></div>
                      <div class="dropdown-item d-flex px-2 py-0 clearOKBtn"></div>
                    </form>
                  </div>
                </div>
              </th>
              <th style="--head1-height: 33px">
                <div class="input-group input-group-sm my-1" style="flex-wrap: nowrap">
                  <input
                    type="text"
                    class="form-control"
                    data-col="ModelName"
                    aria-label="Filter ModelName"
                    
                  />
                  <button
                    type="button"
                    class="input-group-text px-1"
                    aria-label="Select filter for ModelName"
                    data-bs-toggle="dropdown"
                    data-bs-auto-close="outside"
                    aria-expanded="false"
                    data-col-index="4"
                  >
                    <i class="fa-solid fa-chevron-down"></i>
                  </button>
                  <div class="dropdown-menu dropdown-menu-start">
                    <form style="font-size: 0.8rem">
                      <a class="dropdown-item px-2 py-0">
                        <div class="form-check">
                          <input
                            class="form-check-input selectAll"
                            type="checkbox"
                            id="filter-select-all-ModelName-4"
                          />
                          <label class="form-check-label" for="filter-select-all-ModelName-4">
                            Select All
                          </label>
                        </div>
                      </a>
                      <div class="dropdown-divider"></div>
                      <fieldset class="lovValuesFieldset"></fieldset>
                      <div class="dropdown-divider"></div>
                      <div class="dropdown-item d-flex px-2 py-0 clearOKBtn"></div>
                    </form>
                  </div>
                </div>
              </th>
              <th style="--head1-height: 33px">
                <div class="input-group input-group-sm my-1" style="flex-wrap: nowrap">
                  <input
                    type="text"
                    class="form-control"
                    data-col="ProjectName"
                    aria-label="Filter ProjectName"
                    
                  />
                  <button
                    type="button"
                    class="input-group-text px-1"
                    aria-label="Select filter for ProjectName"
                    data-bs-toggle="dropdown"
                    data-bs-auto-close="outside"
                    aria-expanded="false"
                    data-col-index="5"
                  >
                    <i class="fa-solid fa-chevron-down"></i>
                  </button>
                  <div class="dropdown-menu dropdown-menu-start">
                    <form style="font-size: 0.8rem">
                      <a class="dropdown-item px-2 py-0">
                        <div class="form-check">
                          <input
                            class="form-check-input selectAll"
                            type="checkbox"
                            id="filter-select-all-ProjectName-5"
                          />
                          <label class="form-check-label" for="filter-select-all-ProjectName-5">
                            Select All
                          </label>
                        </div>
                      </a>
                      <div class="dropdown-divider"></div>
                      <fieldset class="lovValuesFieldset"></fieldset>
                      <div class="dropdown-divider"></div>
                      <div class="dropdown-item d-flex px-2 py-0 clearOKBtn"></div>
                    </form>
                  </div>
                </div>
              </th>
              <th style="--head1-height: 33px" class="">
                <div class="input-group input-group-sm my-1" style="flex-wrap: nowrap">
                  <input
                    type="text"
                    class="form-control"
                    data-col="CreatedAt"
                    aria-label="Filter CreatedAt"
                    
                  />
                  <button
                    type="button"
                    class="input-group-text px-1"
                    aria-label="Select filter for CreatedAt"
                    data-bs-toggle="dropdown"
                    data-bs-auto-close="outside"
                    aria-expanded="false"
                    data-col-index="6"
                  >
                    <i class="fa-solid fa-chevron-down"></i>
                  </button>
                  <div class="dropdown-menu dropdown-menu-start">
                    <form style="font-size: 0.8rem">
                      <a class="dropdown-item px-2 py-0">
                        <div class="form-check">
                          <input
                            class="form-check-input selectAll"
                            type="checkbox"
                            id="filter-select-all-CreatedAt-6"
                          />
                          <label
                            class="form-check-label"
                            for="filter-select-all-CreatedAt-6"
                          >
                            Select All
                          </label>
                        </div>
                      </a>
                      <div class="dropdown-divider"></div>
                      <fieldset class="lovValuesFieldset"></fieldset>
                      <div class="dropdown-divider"></div>
                      <div class="dropdown-item d-flex px-2 py-0 clearOKBtn"></div>
                    </form>
                  </div>
                </div>
              </th>
              <th style="--head1-height: 33px">
                <div class="input-group input-group-sm my-1" style="flex-wrap: nowrap">
                  <input
                    type="text"
                    class="form-control"
                    data-col="Action"
                    aria-label="Filter Action"
                    
                  />
                  <button
                    type="button"
                    class="input-group-text px-1"
                    aria-label="Select filter for Action"
                    data-bs-toggle="dropdown"
                    data-bs-auto-close="outside"
                    aria-expanded="false"
                    data-col-index="7"
                  >
                    <i class="fa-solid fa-chevron-down"></i>
                  </button>
                  <div class="dropdown-menu dropdown-menu-start">
                    <form style="font-size: 0.8rem">
                      <a class="dropdown-item px-2 py-0">
                        <div class="form-check">
                          <input
                            class="form-check-input selectAll"
                            type="checkbox"
                            id="filter-select-all-Action-7"
                          />
                          <label class="form-check-label" for="filter-select-all-Action-7">
                            Select All
                          </label>
                        </div>
                      </a>
                      <div class="dropdown-divider"></div>
                      <fieldset class="lovValuesFieldset"></fieldset>
                      <div class="dropdown-divider"></div>
                      <div class="dropdown-item d-flex px-2 py-0 clearOKBtn"></div>
                    </form>
                  </div>
                </div>
              </th>
            </tr>
          </thead>
          <tbody class="scl-tbody" id="sclTableBody">
          </tbody>
        </table>
      </div>
      <div
      class="modal fade"
      id="acceptModelModal"
      tabindex="-1"
      aria-labelledby="acceptModelLabel"
      data-bs-backdrop="static"
      data-bs-keyboard="false"
    >
      <div class="modal-dialog modal-md modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="acceptModelLabel">Accept Model</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <div class="modal-body">
            <!-- Target project -->
            <div class="mb-3">
              <label for="acceptFromUser" class="form-label">From User</label>
              <input type="text" class="form-control" id="acceptFromUser" disabled />
            </div>

            <div class="mb-3">
              <label for="acceptModelName" class="form-label">Model Name</label>
              <input type="text" class="form-control" id="acceptModelName" disabled />
              <input type="hidden" id="acceptProjectName" />
              <input type="hidden" id="acceptNotificationId" />
            </div>

            <div class="mb-3">
              <label for="acceptCurrentProject" class="form-label">Current Project</label>
              <input type="text" class="form-control" id="acceptCurrentProject" disabled />
            </div>

            <!-- New model name -->
            <div class="mb-3">
              <label for="acceptNewModelName" class="form-label">New Model Name</label>
              <input
                type="text"
                class="form-control"
                id="acceptNewModelName"
                placeholder="Enter new model name"
              />
            </div>

            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="acceptSaveCopy" required="" />
              <label class="form-check-label" for="acceptSaveCopy">Save As copy</label>
            </div>
          </div>

          <div class="modal-footer">
            <button class="btn btn-secondary me-auto" id="submitRejectModelBtn">Reject</button>
            <button class="btn btn-dark" id="submitAcceptModelBtn" disabled>Accept</button>
          </div>
        </div>
      </div>
    </div>
      <!-- Toolbar -->
      <div class="d-flex justify-content-between align-items-center my-2 mx-1">
        <div class="btn-group" role="group" aria-label="Notification actions">
          <button class="btn btn-sm btn-outline-dark" id="markReadBtn" title="Mark as Read">
            <i class="fa-regular fa-envelope-open me-1" aria-hidden="true"></i>
            Read
          </button>
          <button class="btn btn-sm btn-outline-dark" id="markUnreadBtn" title="Mark as Unread">
            <i class="fa-regular fa-envelope me-1" aria-hidden="true"></i>
            Unread
          </button>
          <button class="btn btn-sm btn-outline-dark" id="archiveBtn" title="Archive">
            <i class="fa-solid fa-box-archive me-1" aria-hidden="true"></i>
            Archive
          </button>
          <button class="btn btn-sm btn-outline-danger" id="deleteNotifBtn" title="Delete">
            <i class="fa-solid fa-trash-alt me-1" aria-hidden="true"></i>
            Delete
          </button>
        </div>
        <div class="d-flex align-items-center gap-2">
          <span class="text-muted mx-2" id="rowCountInfo" aria-live="polite">0 Rows</span>
        </div>
      </div>
    </main>
    <script type="module" src="page_assets/notifications/js/main.js"></script>
  </body>
</html>
