<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supply Chain Lite - Scheduler</title>
    <link rel="icon" type="image/svg+xml" href="scc.svg" />
  </head>
  <body class="min-vh-100 d-flex flex-column">
    <a href="#main-content" class="visually-hidden-focusable">Skip to main content</a>
    <div id="pageLoader" class="page-loader d-none" role="status" aria-live="polite">
      <div class="page-loader__content text-center">
        <div class="spinner-border text-dark" aria-hidden="true"></div>
        <div class="mt-2 small text-body-secondary">Loading scheduler data...</div>
      </div>
    </div>

    <main id="main-content" class="flex-fill d-flex flex-column" tabindex="-1">
      <div class="d-flex justify-content-between align-items-center my-2 mx-1">
        <h5 class="mb-0 d-flex align-items-center" id="schedulerPageTitle" aria-live="polite">
          <i class="fa-solid fa-clock me-2" aria-hidden="true"></i>
          <span>Scheduler Management</span>
        </h5>
        <a href="home-page.html" class="text-dark" aria-label="Go to home page">
          <i class="fa-solid fa-home" aria-hidden="true"></i>
        </a>
      </div>

      <div class="scheduler-section mx-1" aria-labelledby="schedulerPageTitle">
        <div
          id="sclTableDiv"
          class="scheduler-table-wrap"
          role="region"
          aria-label="Scheduler data"
          aria-live="polite"
        >
          <table
            class="table table-hover table-sm table-bordered mb-0 scl-table"
            aria-labelledby="schedulerPageTitle"
          >
            <thead class="scl-thead">
              <tr id="sclTableHead1" class="head1"></tr>
            </thead>
            <tbody class="scl-tbody" id="sclTableBody"></tbody>
          </table>
          <div class="d-flex justify-content-end align-items-center py-2">
            <span class="text-muted small" id="rowCountInfo" aria-live="polite">0 Schedules</span>
          </div>
        </div>
      </div>

      <div class="scheduler-section mx-1 mb-2" aria-labelledby="executionHistoryTitle">
        <div class="d-flex justify-content-between align-items-center py-2">
          <h6 class="mb-0 d-flex align-items-center" id="executionHistoryTitle" aria-live="polite">
            <i class="fa-solid fa-clock-rotate-left me-2" aria-hidden="true"></i>
            <span id="executionHistoryHeading">Execution History</span>
          </h6>
        </div>
        <div
          id="historyTableDiv"
          class="scheduler-table-wrap"
          role="region"
          aria-label="Scheduler execution history"
          aria-live="polite"
        >
          <table class="table table-hover table-sm table-bordered mb-0 scl-table">
            <thead class="scl-thead">
              <tr class="head1">
                <th>Function</th>
                <th>Status</th>
                <th>Started</th>
                <th>Completed</th>
                <th>Duration (s)</th>
                <th>Retry</th>
                <th>Result</th>
              </tr>
            </thead>
            <tbody id="historyTableBody"></tbody>
          </table>
          <div class="d-flex justify-content-end align-items-center py-2">
            <span class="text-muted small" id="executionHistoryCount" aria-live="polite">
              0 Schedules
            </span>
          </div>
        </div>
      </div>

      <div class="modal fade" id="scheduleModal" tabindex="-1" aria-labelledby="scheduleModalLabel">
        <div class="modal-dialog modal-md modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="scheduleModalLabel">Edit scheduler</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <form id="scheduleForm" class="row g-3">
                <input type="hidden" id="scheduleId" />
                <div class="col-12">
                  <label for="scheduleTask" class="form-label fw-semibold">Function</label>
                  <input type="text" class="form-control" id="scheduleTask" disabled />
                </div>
                <div class="col-12">
                  <label for="cronExpression" class="form-label fw-semibold mb-0">
                    Cron expression
                  </label>
                  <input
                    type="text"
                    class="form-control"
                    id="cronExpression"
                    placeholder="* * * * *"
                  />
                </div>
                <div class="col-12">
                  <label for="scheduleDescription" class="form-label fw-semibold">
                    Description
                  </label>
                  <input type="text" class="form-control" id="scheduleDescription" disabled />
                  <div class="form-text">Time shown in this description is in UTC timezone.</div>
                </div>
                <div class="col-12">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="scheduleEnabled" />
                    <label class="form-check-label" for="scheduleEnabled">Enabled</label>
                  </div>
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                Cancel
              </button>
              <button type="button" class="btn btn-dark ms-auto" id="saveScheduleBtn">
                Save changes
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="page_assets/scheduler/js/main.js"></script>
  </body>
</html>
